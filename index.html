<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel Tracker — Options Premium Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ee;
    --surface: #fdfaf6;
    --surface2: #f4efe8;
    --border: rgba(139,107,78,0.14);
    --border2: rgba(139,107,78,0.09);
    --text: #2c1f10;
    --text2: #6b5240;
    --text3: #a89282;
    --blue: #3d6b9e;
    --blue-bg: rgba(61,107,158,0.07);
    --blue-border: rgba(61,107,158,0.2);
    --purple: #7c5cbf;
    --purple-bg: rgba(124,92,191,0.07);
    --green: #3a7d44;
    --green-bg: rgba(58,125,68,0.08);
    --red: #b94040;
    --red-bg: rgba(185,64,64,0.07);
    --amber: #9a6b1a;
    --amber-bg: rgba(154,107,26,0.09);
    --gray: #8a7a6e;
    --gray-bg: rgba(138,122,110,0.08);
    --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --display: 'Lora', Georgia, serif;
    --mono: 'DM Mono', 'SF Mono', monospace;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 4px rgba(44,31,16,0.06), 0 2px 12px rgba(44,31,16,0.04);
    --shadow-md: 0 4px 16px rgba(44,31,16,0.08), 0 1px 4px rgba(44,31,16,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    background-image: 
      radial-gradient(ellipse at 20% 0%, rgba(210,185,155,0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(180,155,125,0.15) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; }

  /* ── Layout ── */
  #app-top, #app-log, #app-modal {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
  }
  #app-top { padding-top: 32px; }
  #app-log { padding-bottom: 80px; }

  /* ── Header ── */
  .header {
    margin-bottom: 28px;
  }
  .header-eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .header-title {
    font-size: 24px;
    font-weight: 600;
    font-family: var(--display);
    letter-spacing: -0.01em;
  }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  /* ── Summary Grid ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .summary-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .summary-cell:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .summary-cell .label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
    font-family: var(--sans);
  }
  .summary-cell .value {
    font-size: 26px; font-family: var(--display);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 4px;
  }
  .summary-cell .sub {
    font-size: 11px;
    color: var(--text3);
    font-family: var(--mono);
  }

  /* ── Section Label ── */
  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  /* ── Holdings ── */
  .holding-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 26px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-sm);
  }
  .holding-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .holding-ticker {
    font-size: 22px;
    font-weight: 600;
    font-family: var(--display);
    letter-spacing: 0;
    margin-bottom: 2px;
  }
  .holding-shares {
    font-size: 11px;
    color: var(--text3);
    font-family: var(--mono);
  }
  .holding-price {
    font-size: 18px;
    font-weight: 600;
    font-family: var(--display);
    text-align: right;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: flex-end;
  }
  .live-dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .holding-price-change {
    font-size: 11px;
    font-family: var(--display);
    text-align: right;
    margin-top: 2px;
  }
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 1px solid var(--border2);
    border-left: 1px solid var(--border2);
  }
  .metric-cell {
    padding: 14px 0 12px;
    border-right: 1px solid var(--border2);
    border-bottom: 1px solid var(--border2);
    padding-left: 18px;
  }
  .metric-cell .label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }
  .metric-cell .value {
    font-size: 16px;
    font-weight: 600;
    font-family: var(--display);
    letter-spacing: -0.01em;
    line-height: 1;
    margin-bottom: 2px;
  }
  .metric-cell .sub {
    font-size: 10px;
    font-family: var(--mono);
  }

  /* ── Chart ── */
  .chart-wrap { margin-bottom: 28px; }
  .chart-inner { padding: 22px 24px 14px; }
  .chart-plot {
    position: relative;
    display: flex;
    align-items: stretch;
    gap: 14px;
    height: 132px;
  }
  .chart-zero {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px dashed var(--border);
    pointer-events: none;
  }
  .chart-col { position: relative; flex: 1; }
  .chart-bar {
    position: absolute;
    left: 0; right: 0;
    border-radius: 5px 5px 0 0;
    background: linear-gradient(to top, rgba(58,125,68,0.22), rgba(58,125,68,0.08));
    border: 1px solid rgba(58,125,68,0.30);
    transition: height 0.4s ease;
  }
  .chart-bar.neg {
    border-radius: 0 0 5px 5px;
    background: linear-gradient(to bottom, rgba(185,64,64,0.22), rgba(185,64,64,0.08));
    border-color: rgba(185,64,64,0.30);
  }
  .chart-bar-val {
    position: absolute;
    left: -4px; right: -4px;
    text-align: center;
    font-size: 10px;
    font-family: var(--display);
    font-weight: 500;
    color: var(--green);
    white-space: nowrap;
  }
  .chart-bar-val.neg { color: var(--red); }
  .chart-labels { display: flex; gap: 14px; padding-top: 10px; }
  .chart-bar-label {
    flex: 1;
    text-align: center;
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text3);
  }

  /* ── Filters / Trade Log ── */
  .log-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .filter-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--text3); color: var(--text2); background: var(--surface2); }
  .filter-btn.active {
    background: #5c3d1e;
    border-color: #5c3d1e;
    color: #fdf8f2;
  }
  .filter-search {
    margin-left: auto;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    font-size: 11px;
    color: var(--text);
    width: 140px;
  }
  .filter-search:focus { outline: none; border-color: var(--blue); }

  /* ── Trade Table ── */
  .trade-header {
    display: grid;
    grid-template-columns: 20px 80px 50px 70px 90px 70px 100px 90px 1fr;
    gap: 0 8px;
    padding: 10px 20px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .trade-row {
    display: grid;
    grid-template-columns: 20px 80px 50px 70px 90px 70px 100px 90px 1fr;
    gap: 0 8px;
    padding: 14px 20px;
    align-items: center;
    cursor: pointer;
    transition: background 0.1s;
  }
  .trade-row:hover { background: rgba(139,107,78,0.04); }
  .trade-divider { border-bottom: 1px solid var(--border2); }
  .trade-chevron {
    color: var(--text3);
    transition: transform 0.2s;
  }
  .trade-chevron.open { transform: rotate(90deg); }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 500;
    font-family: var(--sans);
    letter-spacing: 0.02em;
  }
  .badge-open { background: var(--green-bg); color: var(--green); }
  .badge-expired { background: var(--gray-bg); color: var(--gray); }
  .badge-assigned { background: var(--amber-bg); color: var(--amber); }
  .badge-buyback { background: var(--red-bg); color: var(--red); }

  /* ── Trade Detail ── */
  .trade-detail {
    padding: 16px 20px 20px 52px;
    border-top: 1px solid var(--border2);
    background: linear-gradient(to bottom, var(--surface2), rgba(247,243,238,0.5));
  }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  .detail-item .label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 4px;
  }
  .detail-item .value {
    font-size: 13px;
    font-weight: 600;
    font-family: var(--mono);
  }
  .ror-grid {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border2);
  }
  .ror-cell .label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 3px;
  }
  .ror-cell .value {
    font-size: 16px;
    font-weight: 600;
    font-family: var(--display);
  }
  .ror-cell .sub {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text3);
    margin-top: 1px;
  }

  /* ── Close Trade Actions ── */
  .close-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border2);
    flex-wrap: wrap;
    align-items: center;
  }
  .close-actions-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-right: 4px;
  }
  .close-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--mono);
    transition: all 0.15s;
  }
  .close-btn-expired {
    background: var(--gray-bg);
    border-color: rgba(113,113,122,0.2);
    color: var(--gray);
  }
  .close-btn-expired:hover { background: rgba(113,113,122,0.14); }
  .close-btn-assigned {
    background: var(--amber-bg);
    border-color: rgba(180,83,9,0.2);
    color: var(--amber);
  }
  .close-btn-assigned:hover { background: rgba(180,83,9,0.14); }
  .close-btn-buyback {
    background: var(--red-bg);
    border-color: rgba(220,38,38,0.2);
    color: var(--red);
  }
  .close-btn-buyback:hover { background: rgba(220,38,38,0.14); }
  .btn-edit {
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    transition: all 0.15s;
    margin-left: auto;
  }
  .btn-edit:hover { border-color: var(--text3); color: var(--text); }
  .btn-delete {
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    font-size: 11px;
    color: var(--text3);
    transition: all 0.15s;
  }
  .btn-delete:hover { color: var(--red); background: var(--red-bg); }

  /* ── Buyback Input ── */
  .buyback-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    background: var(--red-bg);
    border: 1px solid rgba(220,38,38,0.15);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
  }
  .buyback-inline label {
    font-size: 11px;
    font-weight: 600;
    color: var(--red);
  }
  .buyback-inline input {
    width: 90px;
    padding: 4px 8px;
    border: 1px solid rgba(220,38,38,0.3);
    border-radius: 6px;
    background: #fff;
    font-size: 13px;
    font-family: var(--mono);
    font-weight: 600;
    color: var(--red);
  }
  .buyback-inline input:focus { outline: none; border-color: var(--red); }
  .buyback-confirm {
    padding: 5px 12px;
    border-radius: 6px;
    border: none;
    background: var(--red);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--mono);
  }
  .buyback-confirm:hover { opacity: 0.85; }
  .buyback-cancel {
    padding: 5px 8px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text3);
    font-size: 11px;
  }

  /* ── Primary Button ── */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 20px;
    border: none;
    background: #5c3d1e;
    color: #fdf8f2;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(92,61,30,0.25);
  }
  .btn-primary:hover { background: #4a3018; box-shadow: 0 4px 12px rgba(92,61,30,0.3); transform: translateY(-1px); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44,31,16,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-box {
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    box-shadow: 0 24px 64px rgba(44,31,16,0.18), 0 4px 16px rgba(44,31,16,0.08);
  }
  .modal-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
  }
  .type-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    background: var(--bg);
    padding: 3px;
    border-radius: var(--radius-sm);
  }
  .type-toggle button {
    flex: 1;
    padding: 7px;
    border-radius: 6px;
    border: none;
    background: transparent;
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    transition: all 0.15s;
  }
  .type-toggle button.active-cc {
    background: var(--surface);
    color: var(--blue);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .type-toggle button.active-csp {
    background: var(--surface);
    color: var(--purple);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }
  .form-input {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 13px;
    font-family: var(--mono);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .form-input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(154,107,26,0.12); }
  .form-select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 13px;
    font-family: var(--mono);
    color: var(--text);
    appearance: none;
  }
  .form-select:focus { outline: none; border-color: var(--blue); }
  .save-btn {
    width: 100%;
    padding: 11px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .save-btn.valid { background: #5c3d1e; color: #fdf8f2; }
  .save-btn.valid:hover { opacity: 0.82; }
  .save-btn.invalid { background: var(--border); color: var(--text3); cursor: not-allowed; }

  /* ── Empty State ── */
  .empty-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--text3);
    font-size: 12px;
    font-family: var(--mono);
  }

  /* ── Misc ── */
  .up { color: var(--green); }
  .down { color: var(--red); }
  .mono { font-family: var(--mono); }

  @media (max-width: 640px) {
    /* Page padding */
    .header { padding: 16px 12px 0; }
    body { overflow-x: hidden; }

    /* Header */
    .header-row { flex-direction: column; align-items: flex-start; gap: 10px; }
    .btn-primary { width: 100%; text-align: center; justify-content: center; }

    /* Summary stats — stack to 1 col */
    .summary-grid { grid-template-columns: 1fr; gap: 8px; }
    .summary-cell { padding: 14px 16px; }
    .summary-cell .value { font-size: 22px; }

    /* Holdings metrics — 2 col */
    .metrics-grid { grid-template-columns: 1fr 1fr; }
    .holding-card { padding: 16px; }

    /* Trade log filter bar */
    .filter-bar { flex-wrap: wrap; gap: 6px; }
    .filter-search { width: 100%; }

    /* Trade table — hide grid header, rows become flex cards */
    .trade-header { display: none; }
    .trade-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding: 12px 14px;
      position: relative;
    }
    .trade-row .trade-chevron { position: absolute; top: 14px; right: 14px; }

    /* Modal */
    .modal-box { padding: 20px 16px; margin: 12px; width: calc(100% - 24px) !important; max-width: none !important; }
    .form-row { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="app-top"></div>
<div id="app-log"></div>
<div id="app-modal"></div>

<script>
// ══════════════════════════════════════════════
// Wheel Tracker v4.1
// ══════════════════════════════════════════════

const INITIAL_POSITIONS = [

const SYNC_WORKER_URL = 'https://wheel-tracker-sync.owacct22.workers.dev';

async function loadPositions() {
  try {
    const res = await fetch(SYNC_WORKER_URL + '/data', { cache: 'no-store' });
    if (!res.ok) throw new Error('Worker GET failed: ' + res.status);
    positions = await res.json();
    render();
    fetchAllPrices();
  } catch(e) {
    console.warn('loadPositions fallback:', e.message);
    const saved = localStorage.getItem('wheel-tracker-positions-v4');
    positions = saved ? JSON.parse(saved) : [...INITIAL_POSITIONS];
    render();
  }
}

// ── Sync to Cloudflare Worker (which proxies to GitHub) ──
async function syncToGitHub() {
  try {
    const ind = document.getElementById('sync-indicator');
    if (ind) { ind.textContent = '\u2191 syncing'; ind.style.color = 'var(--text3)'; }

    const res = await fetch(SYNC_WORKER_URL + '/data', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(positions),
    });

    if (res.ok) {
      const indDone = document.getElementById('sync-indicator');
      if (indDone) {
        indDone.textContent = '\u2713 saved';
        indDone.style.color = 'var(--green)';
        setTimeout(function() { const i = document.getElementById('sync-indicator'); if (i) i.textContent = ''; }, 3000);
      }
    } else {
      throw new Error('Worker PUT failed: ' + res.status);
    }
  } catch(e) {
    const ind = document.getElementById('sync-indicator');
    if (ind) {
      ind.textContent = '\u26a0 sync failed';
      ind.style.color = 'var(--red)';
      setTimeout(function() { if (ind) ind.textContent = ''; }, 4000);
    }
    console.error('Sync error:', e);
  }
}

// ── Live Prices ──
async function fetchLivePrice(ticker) {
  const yahoo = 'https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1d&range=1d';
  // Primary: our own Cloudflare Worker (no third-party dependency, CORS already set).
  // Fallback: allorigins, which is free but intermittently 500s.
  const sources = [
    SYNC_WORKER_URL + '/price?ticker=' + encodeURIComponent(ticker),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(yahoo),
  ];
  for (const url of sources) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(function() { ctl.abort(); }, 8000);
      let resp;
      try { resp = await fetch(url, { signal: ctl.signal, cache: 'no-store' }); }
      finally { clearTimeout(timer); }
      if (!resp.ok) continue;
      const data = await resp.json();
      const result = data.chart?.result?.[0];
      if (result?.meta?.regularMarketPrice) {
        const { regularMarketPrice: price, chartPreviousClose, previousClose } = result.meta;
        const prevClose = chartPreviousClose || previousClose || price;
        livePrices[ticker] = { price, prevClose, change: price - prevClose, changePct: ((price - prevClose) / prevClose * 100) };
        priceTimestamps[ticker] = Date.now();
        priceErrors[ticker] = false;
        return;
      }
    } catch(e) {}
  }
  priceErrors[ticker] = true;
  console.warn('price fetch failed for ' + ticker + ' (all sources)');
}
async function fetchAllPrices() {
  const tickers = [...new Set(positions.map(p => p.ticker))];
  await Promise.all(tickers.map(t => fetchLivePrice(t)));
  renderTop();
}
setInterval(() => {
  const d = new Date(); const h = d.getHours(); const day = d.getDay();
  const marketHours = (day > 0 && day < 6 && h >= 9 && h <= 16);
  // Retry whenever a ticker still has no price at all, even outside market hours -
  // otherwise a single failed load leaves the card stuck until Monday.
  const missing = [...new Set(positions.map(p => p.ticker))].some(t => !livePrices[t]);
  if (marketHours || missing) fetchAllPrices();
}, 60000);

// ── Helpers ──
function fmt(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return '$0.00';
  const str = Math.abs(n).toFixed(2);
  const parts = str.split('.');
  parts[0] = parts[0].replace(/(\d)(?=(\d{3})+$)/g, '$1,');
  return n < 0 ? `-$${parts.join('.')}` : `$${parts.join('.')}`;
}
function sc(v) { return parseFloat(v) < 0 ? 'var(--red)' : 'var(--green)'; }
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
}
function genId() { return 'pos-' + Date.now() + '-' + Math.random().toString(36).slice(2,6); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function svgChevron(open, extra) {
  return `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" class="trade-chevron ${open ? 'open' : ''}" style="${extra||''}"><path d="M6 4l4 4-4 4"/></svg>`;
}

// ── Computed ──
function getStats() {
  const totalPremium = positions.reduce((s, p) => s + p.premium * p.sharesOrContracts * 100, 0);
  const openCount = positions.filter(p => p.status === 'open').length;
  const closedCount = positions.filter(p => p.status !== 'open').length;
  const tickers = [...new Set(positions.map(p => p.ticker))];
  const tickerData = {};
  // Chronological pass so share lots accumulate and unwind in trade order.
  const chrono = [...positions].sort((a, b) => (a.openDate || '').localeCompare(b.openDate || ''));
  chrono.forEach(p => {
    if (!tickerData[p.ticker]) tickerData[p.ticker] = {
      totalPremium: 0, basisPremium: 0, sharePrice: 0, shares: 0,
      lots: [], hadLots: false, legacySharePrice: 0, legacyShares: 0, openCalls: []
    };
    const td = tickerData[p.ticker];
    const contracts = p.sharesOrContracts || 0;
    const qty = contracts * 100;
    const cash = p.premium * qty;

    // Headline lifetime premium - every trade as booked.
    td.totalPremium += cash;

    // Premium applied to SHARE COST BASIS. Two exclusions, both deliberate:
    //  1. status 'open' - premium is received but still at risk; not banked yet.
    //  2. an unassigned cash-secured put - collateralized by cash, not stock, so
    //     its premium is free cash and must NOT reduce the basis of shares held.
    // Without these, selling a put silently lowers net basis and can green-light
    // a covered call below true basis.
    if (p.status !== 'open' && (p.type === 'covered_call' || p.status === 'closed_assigned')) {
      td.basisPremium += cash;
    }

    // Share lots: acquired when a CSP is assigned, released FIFO when a CC is assigned.
    if (p.type === 'cash_secured_put' && p.status === 'closed_assigned') {
      td.lots.push({ shares: qty, price: p.strike });
      td.hadLots = true;
    }
    if (p.type === 'covered_call' && p.status === 'closed_assigned') {
      let remove = qty;
      while (remove > 0 && td.lots.length) {
        const lot = td.lots[0];
        const take = Math.min(remove, lot.shares);
        lot.shares -= take;
        remove -= take;
        if (lot.shares <= 0) td.lots.shift();
      }
    }

    // Fallback for shares acquired outside the wheel (bought outright).
    if (p.type === 'covered_call' || p.status === 'closed_assigned') {
      td.legacySharePrice = p.sharePrice || p.strike;
      td.legacyShares = Math.max(td.legacyShares, qty);
    }

    // Track OPEN short calls for mark-to-market liability calculation
    if (p.type === 'covered_call' && p.status === 'open') {
      td.openCalls.push({ strike: p.strike, contracts: contracts, premium: p.premium });
    }
  });
  // Blend the lots into one cost basis; fall back to legacy single-price behaviour.
  Object.values(tickerData).forEach(td => {
    const lotShares = td.lots.reduce((s, l) => s + l.shares, 0);
    if (td.hadLots) {
      // Lot tracking applies. An empty lot list means genuinely flat (all called
      // away) - do NOT fall back, or a closed-out position reads as still held.
      td.shares = lotShares;
      td.sharePrice = lotShares > 0
        ? td.lots.reduce((s, l) => s + l.shares * l.price, 0) / lotShares
        : 0;
    } else {
      td.shares = td.legacyShares;
      td.sharePrice = td.legacySharePrice;
    }
  });
  const monthly = {};
  positions.forEach(p => {
    const m = p.openDate?.slice(0, 7) || 'unknown';
    monthly[m] = (monthly[m] || 0) + p.premium * p.sharesOrContracts * 100;
  });
  return { totalPremium, openCount, closedCount, tickers, tickerData, monthly };
}
function getFiltered() {
  const typeMap = { covered_call: 'cc', cash_secured_put: 'csp' };
  return positions
    .filter(p => {
      if (filterType !== 'all' && typeMap[p.type] !== filterType) return false;
      if (filterTicker && !p.ticker.toUpperCase().includes(filterTicker.toUpperCase())) return false;
      return true;
    })
    .sort((a, b) => (b.openDate || '').localeCompare(a.openDate || ''));
}

function renderTop() {

        Log Trade
      </button>
    </div>
  </div>`;

  // ── Summary ──
  html += `<div class="summary-grid">
    <div class="summary-cell">
      <div class="label">Total Premium</div>
      <div class="value" style="color:${sc(stats.totalPremium)}">${fmt(stats.totalPremium)}</div>
      <div class="sub">${positions.length} trade${positions.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="summary-cell">
      <div class="label">Open Positions</div>
      <div class="value">${stats.openCount}</div>
      <div class="sub">${stats.tickers.length} ticker${stats.tickers.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="summary-cell">
      <div class="label">Closed</div>
      <div class="value">${stats.closedCount}</div>
      <div class="sub">expired / assigned / bought back</div>
    </div>
  </div>`;

  // ── Holdings ──
  const tkKeys = Object.keys(stats.tickerData);
  if (tkKeys.length > 0) {
    html += `<div class="section-label">Holdings</div>`;
    tkKeys.forEach(ticker => {
      const data = stats.tickerData[ticker];
      const lp = livePrices[ticker];
      const cp = lp?.price || null;
      const shares = data.shares;
      const cb = data.sharePrice;
      const sharesPL = cp && shares ? (cp - cb) * shares : null;
      // Open short calls create a mark-to-market liability when ITM.
      // Intrinsic value = max(0, currentPrice − strike) × 100 × contracts, minus premium already collected.
      // This represents the "locked in" loss on the option leg if held to expiration.
      const openCalls = data.openCalls || [];
      let callLiability = 0;
      let hasOpenCalls = openCalls.length > 0;
      if (cp && hasOpenCalls) {
        openCalls.forEach(oc => {
          const intrinsic = Math.max(0, cp - oc.strike);
          // Liability = intrinsic value owed − premium we collected when we sold it
          callLiability += (intrinsic - oc.premium) * oc.contracts * 100;
        });
      }
      const unrealPL = sharesPL !== null ? sharesPL - callLiability : null;
      const unrealPct = cb > 0 && cp && shares ? (unrealPL / (cb * shares) * 100) : null;
      const premPerSh = shares > 0 ? data.basisPremium / shares : 0;
      const netBasis = cb - premPerSh;
      const isDown = unrealPL < 0;
      const stale = !priceTimestamps[ticker] || (Date.now() - priceTimestamps[ticker] > 120000);

      html += `<div class="holding-card">
        <div class="holding-header">
          <div>
            <div class="holding-ticker">${esc(ticker)}</div>
            <div class="holding-shares">${shares} shares held</div>
          </div>
          <div>`;
      if (cp) {
        html += `<div class="holding-price">
            ${!stale ? '<span class="live-dot"></span>' : ''}
            $${cp.toFixed(2)}
          </div>
          <div class="holding-price-change">
            <span class="${lp.change >= 0 ? 'up' : 'down'}">${lp.change >= 0 ? '+' : ''}${lp.change.toFixed(2)} (${lp.changePct >= 0 ? '+' : ''}${lp.changePct.toFixed(2)}%)</span>
            ${stale ? ' <span style="color:var(--text3);font-size:9px">·delayed</span>' : ''}
          </div>`;
      } else {
        html += `<div class="holding-price" style="color:var(--text3)">—</div>
          <div class="holding-price-change" style="color:var(--text3);font-size:10px">${priceErrors[ticker] ? 'price unavailable - retrying' : 'fetching...'}</div>`;
      }
      html += `</div></div>
        <div class="metrics-grid">
          <div class="metric-cell">
            <div class="label">Cost Basis</div>
            <div class="value">${fmt(cb)}</div>
            <div class="sub" style="color:var(--text3)">per share</div>
          </div>
          <div class="metric-cell">
            <div class="label">Unrealized P&amp;L</div>
            <div class="value" style="color:${isDown?'var(--red)':'var(--green)'}">${unrealPL !== null ? (isDown?'':'+') + fmt(unrealPL) : '—'}</div>
            <div class="sub" style="color:${isDown?'var(--red)':'var(--green)'}">${unrealPct !== null ? (isDown?'':'+') + unrealPct.toFixed(1) + '%' : ''}${hasOpenCalls && callLiability > 0 ? ` · incl. ${fmt(-callLiability)} call liab.` : ''}</div>
          </div>
          <div class="metric-cell">
            <div class="label">Premium Collected</div>
            <div class="value" style="color:${sc(data.totalPremium)}">${fmt(data.totalPremium)}</div>
            <div class="sub" style="color:${sc(premPerSh)}">${fmt(premPerSh)}/sh</div>
          </div>
          <div class="metric-cell">
            <div class="label">Net Basis</div>
            <div class="value" style="color:var(--blue)">${fmt(netBasis)}</div>
            <div class="sub" style="color:var(--text3)">after premiums</div>
          </div>
        </div>
      </div>`;
    });
  }

  // ── Monthly Chart ──
  const monthKeys = Object.keys(stats.monthly).sort();
  if (monthKeys.length > 0) {
    html += `<div class="chart-wrap">
      <div class="section-label">Monthly Premium</div>
      <div class="card chart-inner">`;
    // Scale by the largest magnitude in either direction so a big loss month is
    // drawn to scale instead of clamping to a stub. Zero line floats to suit.
    const vals = monthKeys.map(m => stats.monthly[m]);
    const posMax = Math.max(0, ...vals);
    const negMax = Math.max(0, ...vals.map(v => -v));
    const span = posMax + negMax;
    const PLOT = 132, PAD = 16;
    const usable = PLOT - PAD * (negMax > 0 ? 2 : 1);
    const zeroY = span > 0 ? (negMax / span) * usable + (negMax > 0 ? PAD : 0) : PAD;
    html += `<div class="chart-plot"><div class="chart-zero" style="bottom:${zeroY}px"></div>`;
    monthKeys.forEach(month => {
      const val = stats.monthly[month];
      const h = span > 0 ? Math.max(Math.abs(val) / span * usable, 3) : 3;
      const neg = val < 0;
      const barPos = neg ? `top:${PLOT - zeroY}px` : `bottom:${zeroY}px`;
      const valPos = neg ? `top:${PLOT - zeroY + h + 3}px` : `bottom:${zeroY + h + 3}px`;
      html += `<div class="chart-col">
        <div class="chart-bar${neg ? ' neg' : ''}" style="${barPos};height:${h}px"></div>
        <div class="chart-bar-val${neg ? ' neg' : ''}" style="${valPos}">${fmt(val)}</div>
      </div>`;
    });
    html += `</div><div class="chart-labels">`;
    monthKeys.forEach(month => {
      html += `<div class="chart-bar-label">${month.slice(5)}/${month.slice(2,4)}</div>`;
    });
    html += `</div></div></div>`;
  }

  const _sy = window.scrollY;
  document.getElementById('app-top').innerHTML = html;
  window.scrollTo(0, _sy);
}

            <div class="ror-cell">
              <div class="label">Capital at Risk</div>
              <div class="value" style="color:var(--text2)">${fmt(capRisk)}</div>
              <div class="sub">${pos.sharesOrContracts*100} sh × ${fmt(pos.sharePrice||pos.strike)}</div>
            </div>
          </div>
          <div class="detail-grid">
            <div class="detail-item">
              <div class="label">${isCC?'Share Price':'Share Price'}</div>
              <div class="value">${fmt(pos.sharePrice||pos.strike)}</div>
            </div>
            <div class="detail-item">
              <div class="label">Contracts</div>
              <div class="value">${pos.sharesOrContracts} (${pos.sharesOrContracts*100} sh)</div>
            </div>
            <div class="detail-item">
              <div class="label">Expiration</div>
              <div class="value">${fmtDate(pos.expDate)}</div>
            </div>
            <div class="detail-item">
              <div class="label">Total Premium</div>
              <div class="value" style="color:var(--green);font-weight:700">${fmt(totalPrem)}</div>
            </div>
          </div>
          ${pos.notes ? `<div style="font-size:11px;color:var(--text3);font-style:italic;font-family:var(--mono);line-height:1.6;margin-bottom:4px">${esc(pos.notes)}</div>` : ''}
          <div class="close-actions">`;

        if (isOpen) {
          html += `<span class="close-actions-label">Close as:</span>
            <button class="close-btn close-btn-expired" onclick="event.stopPropagation();closePosition('${pos.id}','closed_expired')">
              ✓ Expired Worthless
            </button>
            <button class="close-btn close-btn-assigned" onclick="event.stopPropagation();closePosition('${pos.id}','closed_assigned')">
              ⬆ ${isCC ? 'Called Away' : 'Assigned'}
            </button>
            <button class="close-btn close-btn-buyback" onclick="event.stopPropagation();showBuybackInput('${pos.id}')">
              ✕ Bought Back
            </button>`;
        } else {
          html += `<span style="font-size:11px;font-family:var(--mono);color:var(--text3)">Closed</span>
            <button class="close-btn" style="background:var(--blue-bg);border-color:rgba(61,107,158,0.2);color:var(--blue)" onclick="event.stopPropagation();reopenPosition('${pos.id}')">
              ↩ Reopen
            </button>`;
        }

        html += `
            <button class="btn-edit" onclick="event.stopPropagation();editPosition('${pos.id}')">Edit</button>
            <button class="btn-delete" onclick="event.stopPropagation();deletePosition('${pos.id}')" title="Delete">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M5.3 4V2.7a1 1 0 011-1h3.4a1 1 0 011 1V4M6.3 7v4.5M9.7 7v4.5M3.5 4l.8 9.3a1 1 0 001 .9h5.4a1 1 0 001-.9L12.5 4"/></svg>
            </button>
          </div>`;

        // Buyback inline input
        if (buybackInputId === pos.id) {
          html += `<div class="buyback-inline" onclick="event.stopPropagation()">
            <label>Bought back at:</label>
            <input type="number" step="0.01" placeholder="0.10" value="${esc(buybackInputVal)}"
              oninput="buybackInputVal=this.value" id="buyback-price-input">
            <button class="buyback-confirm" onclick="confirmBuyback('${pos.id}')">Confirm</button>
            <button class="buyback-cancel" onclick="cancelBuyback()">Cancel</button>
          </div>`;
        }

        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }

  document.getElementById('app-log').innerHTML = html;
}

// ── Modal render — completely separate so it never scrolls anything ──
function renderModal() {
  const container = document.getElementById('app-modal');
  if (!showForm) { container.innerHTML = ''; return; }

  const f = editingPos || {
    type: formType, ticker: '', sharesOrContracts: 1,
    sharePrice: '', strike: '', premium: '', openDate: new Date().toISOString().split('T')[0],
    expDate: '', status: 'open', notes: ''
  };
  const isCC = (editingPos ? editingPos.type : formType) === 'covered_call';
  const valid = f.ticker && f.premium && f.strike;

  container.innerHTML = `<div class="modal-overlay" onclick="closeForm()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">${editingPos ? 'Edit Trade' : 'Log a Trade'}</div>
      <div class="type-toggle">
        <button class="${(editingPos?editingPos.type:formType)==='covered_call'?'active-cc':''}" onclick="formSetType('covered_call')">Covered Call</button>
        <button class="${(editingPos?editingPos.type:formType)==='cash_secured_put'?'active-csp':''}" onclick="formSetType('cash_secured_put')">Cash Secured Put</button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Ticker</label>
          <input class="form-input" id="f-ticker" value="${esc(f.ticker||'')}" placeholder="HOOD" oninput="this.value=this.value.toUpperCase()">
        </div>
        <div class="form-group">
          <label class="form-label">Contracts</label>
          <input class="form-input" id="f-contracts" type="number" value="${f.sharesOrContracts||1}">
        </div>
        <div class="form-group">
          <label class="form-label">${isCC?'Your Avg Share Price':'Current Share Price'}</label>
          <input class="form-input" id="f-sharePrice" type="number" step="0.01" value="${f.sharePrice||''}" placeholder="104.00">
        </div>
        <div class="form-group">
          <label class="form-label">Strike Price</label>
          <input class="form-input" id="f-strike" type="number" step="0.5" value="${f.strike||''}" placeholder="110.00">
        </div>
        <div class="form-group">
          <label class="form-label">Premium / share (net)</label>
          <input class="form-input" id="f-premium" type="number" step="0.01" value="${f.premium||''}" placeholder="0.75">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select" id="f-status">
            <option value="open" ${f.status==='open'?'selected':''}>Open</option>
            <option value="closed_expired" ${f.status==='closed_expired'?'selected':''}>Expired Worthless</option>
            <option value="closed_assigned" ${f.status==='closed_assigned'?'selected':''}>Assigned</option>
            <option value="closed_buyback" ${f.status==='closed_buyback'?'selected':''}>Bought Back</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Open Date</label>
          <input class="form-input" id="f-openDate" type="date" value="${f.openDate||''}">
        </div>
        <div class="form-group">
          <label class="form-label">Expiration Date</label>
          <input class="form-input" id="f-expDate" type="date" value="${f.expDate||''}">
        </div>
        <div class="form-group full">
          <label class="form-label">Notes (optional)</label>
          <input class="form-input" id="f-notes" value="${esc(f.notes||'')}" placeholder="e.g. Sold at $0.80, target buyback at $0.10">
        </div>
      </div>
      <button class="save-btn ${valid?'valid':'invalid'}" onclick="saveForm()">${editingPos?'Save Changes':'Log Trade'}</button>
    </div>
  </div>`;
}

// ── Event Handlers ──
function openForm() { showForm = true; editingPos = null; renderModal(); }
function closeForm() { showForm = false; editingPos = null; renderModal(); }

function formSetType(t) {
  formType = t;
  if (editingPos) editingPos.type = t;
  // Preserve form values when switching type
  const fields = ['f-ticker','f-contracts','f-sharePrice','f-strike','f-premium','f-openDate','f-expDate','f-notes','f-status'];
  const vals = {};
  fields.forEach(id => { const el = document.getElementById(id); if (el) vals[id] = el.value; });
  renderModal();
  fields.forEach(id => { const el = document.getElementById(id); if (el && vals[id] !== undefined) el.value = vals[id]; });
}

function saveForm() {
  const ticker = document.getElementById('f-ticker')?.value?.toUpperCase();
  const strike = parseFloat(document.getElementById('f-strike')?.value);
  const premium = parseFloat(document.getElementById('f-premium')?.value);
  if (!ticker || !strike || !premium) return;
  const currentFormType = editingPos ? editingPos.type : formType;
  const pos = {
    id: editingPos ? editingPos.id : genId(),
    type: currentFormType,
    ticker,
    sharesOrContracts: parseInt(document.getElementById('f-contracts')?.value) || 1,
    sharePrice: parseFloat(document.getElementById('f-sharePrice')?.value) || strike,
    strike, premium,
    openDate: document.getElementById('f-openDate')?.value || '',
    expDate: document.getElementById('f-expDate')?.value || '',
    status: document.getElementById('f-status')?.value || 'open',
    notes: document.getElementById('f-notes')?.value || '',
  };
  if (editingPos) {
    const idx = positions.findIndex(p => p.id === pos.id);
    if (idx >= 0) positions[idx] = pos;
  } else {
    positions.unshift(pos);
  }
  savePositions();
  showForm = false; editingPos = null;
  savePositions();
  const ind4 = document.getElementById('sync-indicator');
  if (ind4) { ind4.textContent = '\u2191 saving\u2026'; ind4.style.color = 'var(--text3)'; }
  syncToGitHub().then(function() {
    renderTop(); renderLog(); renderModal();
  });
  if (!livePrices[ticker]) fetchLivePrice(ticker).then(() => { renderTop(); });
  renderTop(); renderLog(); renderModal();
}

function editPosition(id) {
  const pos = positions.find(p => p.id === id);
  if (pos) { editingPos = {...pos}; formType = pos.type; showForm = true; renderModal(); }
}

function reopenPosition(id) {
  const pos = positions.find(p => p.id === id);
  if (!pos) return;
  pos.status = 'open';
  pos.notes = (pos.notes ? pos.notes + ' - ' : '') + 'Reopened';
  savePositions();
  const ind3 = document.getElementById('sync-indicator');
  if (ind3) { ind3.textContent = '\u2191 saving\u2026'; ind3.style.color = 'var(--text3)'; }
  syncToGitHub().then(function() {
    renderTop(); renderLog();
  });
}

function deletePosition(id) {
  if (confirm('Delete this position?')) {
    positions = positions.filter(p => p.id !== id);
    expandedId = null;
    savePositions(); renderTop(); renderLog();
  }
}

function toggleExpand(id) {
  buybackInputId = null; buybackInputVal = '';
  expandedId = expandedId === id ? null : id;
  renderLog();
}

function setFilter(t) { filterType = t; renderLog(); }
function setTickerFilter(v) { filterTicker = v; renderLog(); }
// Close position shortcuts
function closePosition(id, status) {
  const pos = positions.find(p => p.id === id);
  if (!pos) return;
  pos.status = status;
  if (status === 'closed_expired') {
    pos.notes = (pos.notes ? pos.notes + ' - ' : '') + 'Expired worthless - full premium kept';
  } else if (status === 'closed_assigned') {
    pos.notes = (pos.notes ? pos.notes + ' - ' : '') + 'Assigned at expiration';
  }
  savePositions();
  const ind = document.getElementById('sync-indicator');
  if (ind) { ind.textContent = '\u2191 saving\u2026'; ind.style.color = 'var(--text3)'; }
  syncToGitHub().then(function() {
    renderTop(); renderLog();
  });
}

function showBuybackInput(id) {
  buybackInputId = id;
  buybackInputVal = '';
  renderLog();
  setTimeout(() => { const el = document.getElementById('buyback-price-input'); if (el) el.focus(); }, 30);
}

function cancelBuyback() { buybackInputId = null; buybackInputVal = ''; renderLog(); }

function confirmBuyback(id) {
  const buybackPrice = parseFloat(document.getElementById('buyback-price-input')?.value);
  const pos = positions.find(p => p.id === id);
  if (!pos) return;
  pos.status = 'closed_buyback';
  if (!isNaN(buybackPrice) && buybackPrice > 0) {
    const netPrem = pos.premium - buybackPrice;
    pos.premium = Math.max(0, netPrem);
    pos.notes = (pos.notes ? pos.notes + ' - ' : '') + `Bought back @ $${buybackPrice.toFixed(2)}/sh - net $${Math.max(0,netPrem).toFixed(2)}/sh`;
  } else {
    pos.notes = (pos.notes ? pos.notes + ' - ' : '') + 'Bought back';
  }
  buybackInputId = null; buybackInputVal = '';
  savePositions();
  const ind2 = document.getElementById('sync-indicator');
  if (ind2) { ind2.textContent = '\u2191 saving\u2026'; ind2.style.color = 'var(--text3)'; }
  syncToGitHub().then(function() {
    renderTop(); renderLog();
  });
}

// ── Init ──
loadPositions().then(function() { fetchAllPrices(); });
</script>
</body>
</html>
